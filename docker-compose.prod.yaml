services:
  agent-svc:
    image: ghcr.io/vasenin26/agentmanager:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - DOCKER_HOST=${DOCKER_HOST}
      - REGISTRY_SERVER=${REGISTRY_SERVER}
      - REGISTRY_USERNAME=${REGISTRY_USERNAME}
      - REGISTRY_PASSWORD=${REGISTRY_PASSWORD}
      - SSH_KEYS_DIR=/app/keys
      - API_HOST=${API_HOST}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - BOLT_DB_PATH=/app/data/orchestrator.db
      - TASK_API_URL=${TASK_API_URL}  # Например: https://api.example.com/api/v1/orchestrator
      - TASK_API_TOKEN=${TASK_API_TOKEN}
      - TASK_API_TIMEOUT=${TASK_API_TIMEOUT:-10s}
      - TASK_POLL_INTERVAL=${TASK_POLL_INTERVAL:-5s}
      - AGENT_MEMORY_LIMIT_MB=${AGENT_MEMORY_LIMIT_MB:-512}
      - AGENT_API_TOKEN=${AGENT_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ssh_keys:/app/keys
      - orchestrator_data:/app/data
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/metrics"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - ./loki-data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    depends_on:
      - loki
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml

volumes:
  ssh_keys:
  orchestrator_data:
  loki-data:


